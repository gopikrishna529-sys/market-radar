name: Zacks screen download

on:
  schedule:
    # 11:40 UTC = 6:40 am New York (winter) / 7:40 am (summer), after Zacks' overnight update.
    # The evening stock scan (22:30 UTC) then uses this file in the website and email.
    - cron: "40 11 * * 1-5"
  workflow_dispatch:        # "Run workflow" button to test it any time

permissions:
  contents: write

concurrency:
  group: zacks
  cancel-in-progress: false

jobs:
  zacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check -q playwright pyyaml
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || echo 'xvfb not installed - will run headless'

      - name: Restore saved sign-in cookies
        uses: actions/cache/restore@v4
        with:
          path: .zacks_state/state.enc
          key: zacks-state-${{ github.run_id }}
          restore-keys: zacks-state-

      - name: Unlock cookies
        env:
          ZACKS_PASSWORD: ${{ secrets.ZACKS_PASSWORD }}
        run: |
          if [ -f .zacks_state/state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ZACKS_PASSWORD -in .zacks_state/state.enc -out .zacks_state/state.json \
              && echo "saved cookies found" || { echo "could not unlock old cookies - will sign in"; rm -f .zacks_state/state.json; }
          fi

      - name: Download the saved Zacks screen
        env:
          PYTHONUNBUFFERED: "1"
          ZACKS_USERNAME: ${{ secrets.ZACKS_USERNAME }}
          ZACKS_PASSWORD: ${{ secrets.ZACKS_PASSWORD }}
          ZACKS_SCREEN: ${{ vars.ZACKS_SCREEN }}
        run: |
          ARGS="${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}"
          if command -v xvfb-run >/dev/null; then
            ZACKS_HEADED=1 xvfb-run -a --server-args="-screen 0 1440x1000x24" python -m scanner.zacks_fetch $ARGS
          else
            python -m scanner.zacks_fetch $ARGS
          fi

      - name: Lock and keep cookies for next time
        if: success()
        env:
          ZACKS_PASSWORD: ${{ secrets.ZACKS_PASSWORD }}
        run: |
          if [ -f .zacks_state/state.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ZACKS_PASSWORD -in .zacks_state/state.json -out .zacks_state/state.enc
            rm .zacks_state/state.json
          fi

      - name: Save cookies
        if: success() && hashFiles('.zacks_state/state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .zacks_state/state.enc
          key: zacks-state-${{ github.run_id }}

      - name: Save the CSV to the repository
        if: always()
        run: |
          rm -rf .zacks_state
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A data/zacks
          git diff --cached --quiet && exit 0
          git commit -m "Zacks screen $(TZ=America/New_York date +%d-%m-%Y)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            echo "push failed, retrying in 15s"; sleep 15
          done

      - name: Keep screenshots if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zacks-debug
          path: debug/
          retention-days: 2
