# ------------------------------------------------------------
# Stock Scanner settings - edit these values, then commit.
# ------------------------------------------------------------

# Massive API (free tier = 5 requests/minute)
api:
  base_url: "https://api.massive.com"
  requests_per_minute: 5

# How much history to keep. "auto" = as far back as the plan allows (plan_years).
# Free plan: 2 years. On a paid plan set plan_years: 5 (Starter) and press Run workflow once.
history:
  start: auto
  plan_years: 2

# Which stocks to scan
universe:
  ticker_types: ["CS", "ADRC"]   # CS = common stock, ADRC = ADRs. ETFs are excluded.
  min_price: 5.0                 # ignore stocks below $5
  min_avg_volume: 500000         # 50-day average daily volume
  min_history_days: 210          # need enough bars for the 200 EMA

# EMA trend: EMA9 > EMA20 > EMA50 > EMA100 > EMA200 (long). Short = the reverse order.
ema:
  periods: [9, 20, 50, 100, 200]
  exit: 50                       # strategy exits after a daily close beyond this EMA

# Breakout rule: EMA trend AND close above the highest high of the previous N days
breakout:
  lookback_days: 20

# Relative strength
relative_strength:
  benchmark: "SPY"               # SPY is used as the S&P 500 (SPX) proxy
  rs_day_min_gain_pct: 0.0       # "SPY down, stock up": stock must gain more than this %
  leaders_min_rating: 80         # RS rating (1-99) needed for the RS Leaders list

# Sector rotation: sector ETFs compared with the benchmark
sectors:
  XLK: Technology
  XLF: Financials
  XLV: Health Care
  XLY: Consumer Discretionary
  XLP: Consumer Staples
  XLE: Energy
  XLI: Industrials
  XLB: Materials
  XLU: Utilities
  XLRE: Real Estate
  XLC: Communication Services

# Narrower industry groups (also shown in the rotation table)
industries:
  SMH: Semiconductors
  IGV: Software
  XBI: Biotech
  KRE: Regional Banks
  ITB: Homebuilders
  XRT: Retail
  XOP: Oil & Gas Exploration
  GDX: Gold Miners
  ITA: Aerospace & Defense
  JETS: Airlines

# Portfolio backtest (Portfolio tab)
#   Long : EMA trend becomes set -> buy next open;  exit next open after a close BELOW the exit EMA (50)
#   Short: EMA downtrend becomes set -> short next open; exit next open after a close ABOVE the exit EMA (50)
backtest:
  sides: ["long", "short"]
  max_positions: 20              # portfolio slots, each = 1/20 of the account at entry
  cost_per_side_pct: 0.05        # commission + slippage per buy/sell, in %

# Chart page: which tickers get a chart file
chart:
  min_price: 1.0
  min_avg_volume: 50000
  extra_tickers: ["QQQ", "IWM", "DIA", "TLT", "GLD"]

# Report
report:
  max_rows_email: 40             # rows per list in the email (website shows all)
  site_title: "Market Radar"
