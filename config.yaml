# ------------------------------------------------------------
# Stock Scanner settings - edit these values, then commit.
# ------------------------------------------------------------

# Massive API (free tier = 5 requests/minute)
api:
  base_url: "https://api.massive.com"
  requests_per_minute: 5

# How much history to keep. "auto" = as far back as the plan allows (plan_years).
# Free plan: 2 years. On a paid plan set plan_years: 5 (Starter) and press Run workflow once.
history:
  start: auto
  plan_years: 2

# Which stocks to scan
universe:
  ticker_types: ["CS", "ADRC", "ETF", "ETV"]   # common stocks, ADRs, ETFs and ETF-like funds (e.g. GLD)
  exclude_leveraged_etfs: true   # drop 2x/3x leveraged and inverse ETFs (they decay over time by design)
  # Liquidity filter (checked on the signal day for the backtest, on the last day for the scanner)
  min_price: 10.0                # ignore stocks below $10
  min_avg_volume: 300000         # 50-day average shares traded per day
  min_avg_dollar_volume: 20000000   # 50-day average traded value per day ($20M)
  min_history_days: 210          # need enough bars for the 200 EMA

# EMA trend: EMA9 > EMA20 > EMA50 > EMA100 > EMA200 (long). Short = the reverse order.
ema:
  periods: [9, 20, 50, 100, 200]
  exit: 50                       # strategy exits after a daily close beyond this EMA

# Breakout rule: EMA trend AND close above the highest high of the previous N days
breakout:
  lookback_days: 20

# Relative strength
relative_strength:
  benchmark: "SPY"               # SPY is used as the S&P 500 (SPX) proxy
  rs_day_min_gain_pct: 0.0       # "SPY down, stock up": stock must gain more than this %
  leaders_min_rating: 80         # RS rating (1-99) needed for the RS Leaders list

# Sector rotation: sector ETFs compared with the benchmark
sectors:
  XLK: Technology
  XLF: Financials
  XLV: Health Care
  XLY: Consumer Discretionary
  XLP: Consumer Staples
  XLE: Energy
  XLI: Industrials
  XLB: Materials
  XLU: Utilities
  XLRE: Real Estate
  XLC: Communication Services

# Narrower industry groups (also shown in the rotation table)
industries:
  SMH: Semiconductors
  IGV: Software
  XBI: Biotech
  KRE: Regional Banks
  ITB: Homebuilders
  XRT: Retail
  XOP: Oil & Gas Exploration
  GDX: Gold Miners
  ITA: Aerospace & Defense
  JETS: Airlines

# Portfolio backtest (Portfolio tab)
#   Long : EMA trend becomes set -> buy next open;  exit next open after a close BELOW the exit EMA (50)
#   Short: EMA downtrend becomes set -> short next open; exit next open after a close ABOVE the exit EMA (50)
backtest:
  sides: ["long", "short"]
  # No position limit: every signal is traded. The portfolio's daily return is the equal-weighted
  # average of all open trades; the dollar view assumes the same amount in every trade.
  dollars_per_trade: 10000
  cost_per_side_pct: 0.05        # commission + slippage per buy/sell, in %

# Chart page: which tickers get a chart file
chart:
  min_price: 1.0
  min_avg_volume: 50000
  extra_tickers: ["QQQ", "IWM", "DIA", "TLT", "GLD"]

# Report
report:
  max_rows_email: 40             # rows per list in the email (website shows all)
  site_title: "Market Radar"

# Sectors tab: which stocks belong to each rotation ETF's group
# (matched on the sector name, or on words in the industry name)
groups:
  XLK: {sector: "Technology"}
  XLF: {sector: "Finance"}
  XLV: {sector: "Health Care"}
  XLY: {sector: "Consumer Discretionary"}
  XLP: {sector: "Consumer Staples"}
  XLE: {sector: "Energy"}
  XLI: {sector: "Industrials"}
  XLB: {sector: "Basic Materials"}
  XLU: {sector: "Utilities"}
  XLRE: {sector: "Real Estate"}
  XLC: {sector: "Telecommunications"}
  SMH: {industry: ["semiconductor"]}
  IGV: {industry: ["software", "edp services"]}
  XBI: {industry: ["biotechnology", "biological products", "pharmaceutical preparations"]}
  KRE: {industry: ["banks", "savings institutions"]}
  ITB: {industry: ["homebuilding", "building products", "home furnishings", "building materials"]}
  XRT: {industry: ["retail", "department", "clothing", "apparel", "catalog"]}
  XOP: {industry: ["oil & gas production", "oil and gas", "integrated oil", "crude petroleum"]}
  GDX: {industry: ["precious metals", "gold"]}
  ITA: {industry: ["aerospace", "military", "ordnance"]}
  JETS: {industry: ["airline", "air transport", "air freight"]}

# Zacks Premium saved screens, downloaded every weekday by the "Zacks screen download" workflow.
# name = the screen's name exactly as in Zacks > Stock Screener > My Screen
# file = start of the saved file name: data/zacks/<file>_DD-MM-YYYY.csv
zacks:
  screens:
    - name: market-radar
      file: zacks_rank
    - name: market-radar-target-price
      file: zacks_targets
    # - name: another-screen              # <- more screens can be added like this
    #   file: zacks_other
  # columns drawn as dashed lines on the chart: any column whose name contains one of these words
  chart_levels: [target]
