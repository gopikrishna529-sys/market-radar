<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b0f14;--panel:#121820;--panel2:#18202a;--line:#232d39;--text:#e7ebf0;--muted:#8794a3;
--up:#26a69a;--down:#ef5350;--accent:#4c9ffe;--gold:#f5c542;--leading:#26a69a;--improving:#4c9ffe;--weakening:#f5a623;--lagging:#ef5350}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 11px}
button{cursor:pointer}button:hover{border-color:#3a4a5c}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 12px}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
header{display:flex;align-items:center;gap:22px;padding:0 22px;height:56px;border-bottom:1px solid var(--line);background:#0d1218;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}.brand span{color:var(--accent)}
nav{display:flex;gap:2px;height:100%;overflow-x:auto}
nav a{display:flex;align-items:center;padding:0 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--text);border-bottom-color:var(--accent)}nav a:hover{color:var(--text)}
.asof{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
main{padding:18px 22px 60px;max-width:1700px;margin:0 auto}
h2{font-size:18px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:650}
.card h3 small{color:var(--muted);font-weight:400;margin-left:6px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}.gold{color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:21px;font-weight:650;margin-top:3px}.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--panel2)}
td.r,th.r{text-align:right}
.tk{font-weight:650;color:var(--accent);cursor:pointer}
.nm{color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis}
.wl{cursor:pointer;color:#5d6b7b;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:4px;opacity:.55}
tr:hover .wl,.wl.on,.info .wl{opacity:1}.wl.on{color:var(--accent);border-color:#4c9ffe66}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pill.L{background:#26a69a22;color:var(--up)}.pill.S{background:#ef535022;color:var(--down)}.pill.N{background:#8794a322;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:9px 14px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.n{background:var(--panel2);border-radius:9px;padding:1px 7px;margin-left:6px;font-size:12px}
.heat td{text-align:center;font-size:12.5px;padding:6px 4px}.heat th{text-align:center}
.hist{display:flex;align-items:flex-end;gap:3px;height:190px;padding-top:10px}
.hist div{flex:1;border-radius:3px 3px 0 0;position:relative;min-height:1px}
.hist div:hover{outline:1px solid #fff}
.hx{display:flex;gap:3px;font-size:10.5px;color:var(--muted)}.hx span{flex:1;text-align:center}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted)}
.rchart{position:relative;width:100%;user-select:none;touch-action:none}
.rchart canvas{display:block;cursor:crosshair}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.qlist b{margin-right:2px}
.note{color:var(--muted);font-size:12.5px;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.info{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}.info .big{font-size:24px;font-weight:700}
.tbl-wrap{overflow-x:auto}
table.trades tbody tr{cursor:pointer} tr.sel td{background:#1d2a3a!important}
.loading{color:var(--muted);padding:30px;text-align:center}
.hsearch{position:relative;margin-left:auto}
#cvcard.full{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;overflow:auto}
.tbl-wrap.scroll{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tbl-wrap.scroll thead th{position:sticky;top:0;background:var(--panel);z-index:2}
.qbox{max-height:200px;overflow:auto}
.hsearch input{width:300px;padding:7px 12px 7px 32px;background:#121820 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238794a3' stroke-width='2'><circle cx='6' cy='6' r='5'/><path d='M10 10l3 3'/></svg>") no-repeat 11px center}
.asof{margin-left:16px!important}
.ac{position:absolute;z-index:60;background:#121a23;border:1px solid #2c3a4a;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);max-height:420px;overflow:auto;min-width:340px;display:none}
.ac .it{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:7px 12px;cursor:pointer;border-bottom:1px solid #1a232e}
.ac .it:last-child{border-bottom:0}.ac .it.on,.ac .it:hover{background:#1d2a3a}
.ac .it b{color:var(--accent)}.ac .it .nm2{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.ac .it .px{text-align:right;font-size:12.5px;white-space:nowrap}.ac mark{background:none;color:#fff;text-decoration:underline}
.ac .hint{padding:6px 12px;color:var(--muted);font-size:12px}
.pv{position:fixed;z-index:70;width:360px;background:#111820;border:1px solid #2c3a4a;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:10px 12px;pointer-events:none;display:none}
.pv .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pv .h b{font-size:15px}.pv canvas{display:block;margin-top:6px;width:336px;height:170px}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.dl-grid{grid-template-columns:1fr}}
.dl-grid .card p{margin:4px 0 12px}
.Leading{color:var(--leading)}.Improving{color:var(--improving)}.Weakening{color:var(--weakening)}.Lagging{color:var(--lagging)}
</style>
</head>

<header>
  <div class="brand">Market <span>Radar</span></div>
  <nav id="nav">
    <a href="#portfolio" data-r="portfolio">Portfolio</a>

<script>
const EMA = __EMA__;
const REPO = "__REPO__";   // owner/repo, used to read the saved daily market files
/* ------------------------------------------------------------------ utilities */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fd = iso => { if(!iso) return "–"; const [y,m,d] = iso.slice(0,10).split("-"); return `${d}-${MON[+m-1]}-${y.slice(2)}`; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls = v => v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : "";
const pct = (v, d=2) => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d) + "%";
const num = (v, d=2) => v == null ? "–" : Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const $ = s => document.querySelector(s);
const cache = {};
const J = url => cache[url] ||= fetch(url, {cache:"no-cache"}).then(r => { if(!r.ok) throw new Error(url); return r.json(); });
function fmtPx(v){ if(v==null||!isFinite(v)) return "–"; const a=Math.abs(v); return a>=1000?v.toFixed(0):a>=10?v.toFixed(2):a>=1?v.toFixed(2):v.toFixed(4); }
function sortRows(rows, key, dir){ return [...rows].sort((a,b)=>{const x=a[key],y=b[key]; if(x==null)return 1; if(y==null)return -1; return (x>y?1:x<y?-1:0)*dir;}); }

/* ------------------------------------------------------------------ watchlist store (browser) */
const WL = {
  load(){ try{ return JSON.parse(localStorage.getItem("mr_wl")) || {active:"My list",lists:{"My list":[]}}; }catch(e){ return {active:"My list",lists:{"My list":[]}}; } },
  save(s){ try{ localStorage.setItem("mr_wl", JSON.stringify(s)); }catch(e){} },
  has(t){ const s=this.load(); return (s.lists[s.active]||[]).includes(t); },
  toggle(t){ const s=this.load(); const l=s.lists[s.active] ||= []; const i=l.indexOf(t); i>=0?l.splice(i,1):l.push(t); this.save(s); return i<0; },
};
function starHTML(t){ const on=WL.has(t); return `<span class="wl ${on?"on":""}" data-star="${esc(t)}" title="Add to / remove from watchlist">${on?"✓ Watching":"+ Watch"}</span>`; }
document.addEventListener("click", e => {
  const s = e.target.closest("[data-star]"); if(s){ e.stopPropagation(); const on = WL.toggle(s.dataset.star); document.querySelectorAll(`[data-star="${CSS.escape(s.dataset.star)}"]`).forEach(x=>{x.classList.toggle("on",on);x.textContent=on?"✓ Watching":"+ Watch";}); return; }
  const tr = e.target.closest("[data-trade]"); if(tr){ const [tk,d]=tr.dataset.trade.split("|"); location.hash=`#chart/${encodeURIComponent(tk)}/${d}`; return; }
  const t = e.target.closest("[data-tk]"); if(t){ location.hash = "#chart/" + encodeURIComponent(t.dataset.tk) + (t.dataset.d?"/"+t.dataset.d:""); }
});

/* ------------------------------------------------------------------ chart engine (canvas, TradingView-style) */
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
class RChart{
  /* Canvas chart. Mouse: drag = pan (also vertically once a pane is scaled) · wheel = zoom time ·
     drag or wheel on the price axis = zoom that pane vertically · double-click plot = reset view ·
     double-click axis = auto-scale that pane · Shift+drag or the Measure button = measure a move · Esc = clear */
  constructor(el, cfg){
    this.el=el; this.cfg=cfg; this.n=cfg.dates.length; el.innerHTML=""; el.classList.add("rchart");
    el.style.height=(cfg.height||500)+"px";
    this.cv=document.createElement("canvas"); el.appendChild(this.cv); this.ctx=this.cv.getContext("2d");
    this.ys=cfg.panes.map(()=>({s:1,o:0})); this.measureMode=false; this.meas=null;
    this.reset(cfg.initial||70); this.hover=null; this.my=null;
    const c=this.cv, pos=e=>{const r=c.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
    c.addEventListener("wheel",e=>{ const [x,y]=pos(e); const pi=this.paneAt(y);
      const zoom=e.ctrlKey||e.metaKey;                              // trackpad pinch, or Ctrl/⌘ + scroll
      const horiz=Math.abs(e.deltaX)>Math.abs(e.deltaY), onDates=y>this.H-28;   // the date line along the bottom
      if(!zoom&&!horiz&&!onDates) return;                           // up/down scroll over the chart: the page scrolls
      e.preventDefault();                                           // (also stops the Mac back-swipe over the chart)
      if(!zoom){ if(!onDates) return;                               // sideways swipe moves the chart only on the date line
        const dd=horiz?e.deltaX:e.deltaY, d=dd/this.plotW*(this.to-this.from); this.from+=d; this.to+=d; this.clamp(); this.draw(); return; }
      const f=Math.exp(Math.max(-.25,Math.min(.25,e.deltaY*.008)));
      if(x>this.plotW&&pi!=null){ this.ys[pi].s=Math.max(.05,Math.min(40,this.ys[pi].s*f)); this.draw(); return; }
      this.zoomAt(x,f); },{passive:false});
    c.addEventListener("pointerdown",e=>{ const [x,y]=pos(e); const pi=this.paneAt(y); c.setPointerCapture(e.pointerId);
      if(this.meas&&this.meas.live&&this.meas.waiting){ this.meas.i1=Math.round(this.iOf(Math.min(x,this.plotW))); this.meas.v1=this.valAt(this.meas.pi,y); this.finishMeasure(); return; }
      if(x>this.plotW&&pi!=null){ this.axisDrag={pi,y,s0:this.ys[pi].s}; return; }
      if((this.measureMode||e.shiftKey)&&pi!=null){ const i=Math.round(this.iOf(x)), v=this.valAt(pi,y); this.meas={pi,i0:i,v0:v,i1:i,v1:v,live:true,sx:x,sy:y}; this.draw(); return; }
      if(this.meas&&!this.meas.live) this.meas=null;
      this.drag={x,y,f:this.from,t:this.to,pi,o0:pi!=null?this.ys[pi].o:0}; });
    c.addEventListener("pointermove",e=>{ const [x,y]=pos(e);
      c.style.cursor=x>this.plotW?"ns-resize":(this.measureMode||e.shiftKey)?"crosshair":this.drag?"grabbing":"crosshair";
      if(this.axisDrag){ const A=this.axisDrag; this.ys[A.pi].s=Math.max(.05,Math.min(40,A.s0*Math.exp((y-A.y)*.006))); this.draw(); return; }
      if(this.meas&&this.meas.live){ this.meas.i1=Math.round(this.iOf(Math.min(x,this.plotW))); this.meas.v1=this.valAt(this.meas.pi,y); }
      else if(this.drag){ const D=this.drag, d=(x-D.x)/this.plotW*(D.t-D.f); this.from=D.f-d; this.to=D.t-d; this.clamp();
        const Y=this.ys[D.pi]; const g=this.paneGeo&&this.paneGeo[D.pi];
        if(Y&&g&&(Y.s!==1||Y.o!==0)) Y.o=D.o0+(y-D.y)/(g.bot-g.top)*Y.s; }
      this.hover=Math.round(this.iOf(Math.min(x,this.plotW))); this.my=y; this.draw(); this.cfg.onHover&&this.cfg.onHover(this.hidx()); });
    const up=e=>{ this.drag=null; this.axisDrag=null; const M=this.meas; if(M&&M.live&&!M.waiting){ const [x,y]=pos(e);
        if(Math.hypot(x-M.sx,y-M.sy)<5){ M.waiting=true; return; }        // a click (no drag): the next click sets the end point
        this.finishMeasure(); } };
    c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up);
    c.addEventListener("pointerleave",()=>{ if(this.drag||this.axisDrag||(this.meas&&this.meas.live)) return; this.hover=null; this.my=null; this.draw(); this.cfg.onHover&&this.cfg.onHover(null); });
    c.addEventListener("dblclick",e=>{ const [x,y]=pos(e); const pi=this.paneAt(y);
      if(x>this.plotW&&pi!=null){ this.ys[pi]={s:1,o:0}; } else { this.reset(this.cfg.initial||70); this.ys=this.cfg.panes.map(()=>({s:1,o:0})); this.meas=null; } this.draw(); });
    this.onKey=e=>{ if(e.key==="Escape"&&this.meas){ this.meas=null; this.draw(); } }; window.addEventListener("keydown",this.onKey);
    this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(el);
  }
  finishMeasure(){ const M=this.meas; if(!M) return; M.live=false; M.waiting=false;
    if(this.measureMode){ this.measureMode=false; this.cfg.onMeasureEnd&&this.cfg.onMeasureEnd(); } this.draw(); }
  destroy(){ this.ro.disconnect(); window.removeEventListener("keydown",this.onKey); }
  reset(count){ this.to=this.n-1+3; this.from=this.to-Math.min(count,this.n+3); }
  setBars(count){ this.reset(count); this.draw(); }
  zoomAt(x,f){ const a=this.iOf(x); let span=(this.to-this.from)*f; span=Math.max(10,Math.min(this.n+40,span));
    this.from=a-(a-this.from)*span/(this.to-this.from); this.to=this.from+span; this.clamp(); this.draw(); }
  setMeasure(on){ this.measureMode=on; }
  highlight(a,b){ this.hl=[a,b]; this.draw(); }
  centerOn(i,span){ span=span||(this.to-this.from); this.from=i-span/2; this.to=i+span/2; this.clamp(); this.draw(); }
  clamp(){ const span=this.to-this.from; if(this.to>this.n-1+30){this.to=this.n-1+30;this.from=this.to-span;} if(this.from<-30){this.from=-30;this.to=this.from+span;} }
  hidx(){ return this.hover==null?null:Math.max(0,Math.min(this.n-1,this.hover)); }
  iOf(x){ return this.from+x/this.plotW*(this.to-this.from); }
  xOf(i){ return (i-this.from)/(this.to-this.from)*this.plotW; }
  paneAt(y){ if(!this.paneGeo) return null; const k=this.paneGeo.findIndex(p=>y>=p.y0&&y<p.y0+p.ph); return k<0?null:k; }
  valAt(pi,y){ const p=this.paneGeo[pi]; return p.mn+(p.bot-y)/(p.bot-p.top)*(p.mx-p.mn); }
  resize(){ const w=this.el.clientWidth; if(!w) return; const h=this.cfg.height||500, d=window.devicePixelRatio||1;
    this.W=w; this.H=h; this.cv.width=w*d; this.cv.height=h*d; this.cv.style.width=w+"px"; this.cv.style.height=h+"px"; this.ctx.setTransform(d,0,0,d,0,0); this.draw(); }
  draw(){
    const g=this.ctx, W=this.W, H=this.H; if(!W) return;
    const axisW=82, dateH=28; this.plotW=W-axisW; const plotW=this.plotW;
    const F="-apple-system,BlinkMacSystemFont,Segoe UI,Arial";
    g.clearRect(0,0,W,H); g.fillStyle="#0b0f14"; g.fillRect(0,0,W,H);
    const panes=this.cfg.panes, tw=panes.reduce((s,p)=>s+(p.w||1),0); let y0=0; const avail=H-dateH;
    const i0=Math.max(0,Math.floor(this.from)), i1=Math.min(this.n-1,Math.ceil(this.to));
    const bw=plotW/(this.to-this.from); const hi=this.hidx(); const li=hi??(this.n-1);
    g.textBaseline="middle"; this.paneGeo=[];
    panes.forEach((p,pi)=>{
      const ph=avail*(p.w||1)/tw, top=y0+24, bot=y0+ph-8; let mn=Infinity,mx=-Infinity;
      for(const s of p.series){ if(s.overlay) continue;
        for(let i=i0;i<=i1;i++){ if(s.type==="candle"){const lo=s.l[i],h2=s.h[i]; if(lo!=null&&h2!=null){mn=Math.min(mn,lo);mx=Math.max(mx,h2);}} else {const v=s.v[i]; if(v!=null&&isFinite(v)){mn=Math.min(mn,v);mx=Math.max(mx,v);}} }
        if(s.type==="hist"){mn=Math.min(mn,0);mx=Math.max(mx,0);} }
      for(const r of (p.refs||[])) if(r.inRange){mn=Math.min(mn,r.v);mx=Math.max(mx,r.v);}
      if(!isFinite(mn)){mn=0;mx=1;} if(mx===mn){mx+=1;mn-=1;} const pad=(mx-mn)*0.06; mn-=pad; mx+=pad;
      const sc=this.ys[pi]; if(sc.s!==1||sc.o!==0){ const rng=mx-mn, mid=(mn+mx)/2+sc.o*rng, half=rng/2*sc.s; mn=mid-half; mx=mid+half; }
      const Y=v=>bot-(v-mn)/(mx-mn)*(bot-top); const fmt=p.fmt||fmtPx;
      this.paneGeo.push({y0,ph,Y,mn,mx,top,bot,fmt});
      if(this.hl&&pi===0){ const xa=this.xOf(this.hl[0]-.5), xb=this.xOf(this.hl[1]+.5); g.fillStyle="rgba(76,159,254,.13)"; g.fillRect(xa,0,xb-xa,avail);
        g.strokeStyle="rgba(76,159,254,.8)"; g.setLineDash([5,4]); g.beginPath(); g.moveTo(Math.round(this.xOf(this.hl[0]))+.5,0); g.lineTo(Math.round(this.xOf(this.hl[0]))+.5,avail); g.stroke(); g.setLineDash([]); }
      for(const b of (p.bands||[])){ if(b[1]<i0||b[0]>i1) continue; const xa=this.xOf(b[0]-.5), xb=this.xOf(b[1]+.5); g.fillStyle=b[2]; g.fillRect(Math.max(0,xa),y0,Math.min(plotW,xb)-Math.max(0,xa),ph); }
      const st=niceStep((mx-mn)/Math.max(2,Math.floor((bot-top)/52)));
      g.strokeStyle="#18212b"; g.lineWidth=1; g.fillStyle="#9aa6b4"; g.textAlign="left"; g.font=`13px ${F}`;

/* ------------------------------------------------------------------ indicators (match the Python side) */
function emaArr(c,span){ const out=new Array(c.length).fill(null), a=2/(span+1); let e=null,cnt=0;
  for(let i=0;i<c.length;i++){ const v=c[i]; if(v==null){ out[i]=cnt>=span?e:null; continue;} e=e==null?v:a*v+(1-a)*e; cnt++; out[i]=cnt>=span?e:null; } return out; }
function rma(x,len){ const out=new Array(x.length).fill(null); let s=0,cnt=0,v=null;
  for(let i=0;i<x.length;i++){ if(x[i]==null){out[i]=v;continue;} if(cnt<len){s+=x[i];cnt++; if(cnt===len){v=s/len; out[i]=v;} } else { v=(v*(len-1)+x[i])/len; out[i]=v; } } return out; }
function dmi(h,l,c,len=14){ const n=c.length, pdm=new Array(n).fill(null), mdm=new Array(n).fill(null), tr=new Array(n).fill(null);
  for(let i=1;i<n;i++){ if(h[i]==null||h[i-1]==null||c[i-1]==null) continue; const up=h[i]-h[i-1], dn=l[i-1]-l[i];
    pdm[i]=up>dn&&up>0?up:0; mdm[i]=dn>up&&dn>0?dn:0; tr[i]=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])); }
  const t=rma(tr,len), p=rma(pdm,len), m=rma(mdm,len), plus=[], minus=[], dx=[];
  for(let i=0;i<n;i++){ if(t[i]==null||!t[i]){plus.push(null);minus.push(null);dx.push(null);continue;} const a=100*p[i]/t[i], b=100*m[i]/t[i]; plus.push(a); minus.push(b); dx.push(100*Math.abs(a-b)/((a+b)||1)); }
  return {plus,minus,adx:rma(dx,len)}; }
const EP=[...EMA.periods].sort((a,b)=>a-b), EMA_TXT=EP.map(p=>"EMA"+p).join(" > ");
const EMA_COL={9:"#00bcd4",10:"#00bcd4",20:"#4c9ffe",21:"#4c9ffe",50:"#f5a623",100:"#ec407a",150:"#ec407a",200:"#c77dff"};
function trendStates(c){ const e={}; for(const p of new Set([...EP,EMA.exit])) e[p]=emaArr(c,p); const st=new Array(c.length).fill(0);
  for(let i=0;i<c.length;i++){ const v=EP.map(p=>e[p][i]); if(v.some(x=>x==null)) continue; let up=true,dn=true;
    for(let k=0;k<v.length-1;k++){ if(!(v[k]>v[k+1])) up=false; if(!(v[k]<v[k+1])) dn=false; } st[i]=up?1:dn?-1:0; }
  return {e,st}; }

/* ---- search: matches ticker OR company name ---- */
function searchStocks(q,limit=12){ q=q.trim().toUpperCase(); if(!q||!STOCKS) return []; const out=[];
  for(const x of STOCKS.list){ const t=x.ticker, n=(x.name||"").toUpperCase(); let sc=-1;
    if(t===q) sc=0; else if(t.startsWith(q)) sc=1; else if(n.startsWith(q)) sc=2; else if(n.includes(" "+q)) sc=3; else if(t.includes(q)) sc=4; else if(n.includes(q)) sc=5;
    if(sc>=0) out.push([sc,t.length,x]); }
  out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||((b[2].avg_vol_k||0)-(a[2].avg_vol_k||0))); return out.slice(0,limit).map(a=>a[2]); }

function attachAC(input,onPick){

  const render=async()=>{ await stocks(); const q=input.value.split(/[,;]/).pop(); items=searchStocks(q); sel=items.length?0:-1;
    if(!q.trim()){ box.style.display="none"; return; } place(); box.style.display="block";
    box.innerHTML=items.length?items.map((x,k)=>`<div class="it ${k===sel?"on":""}" data-k="${k}"><b>${hlq(x.ticker,q)}</b><span class="nm2">${hlq(x.name||"",q)}</span><span class="px">${fmtPx(x.close)} <span class="${cls(x.chg)}">${pct(x.chg)}</span></span></div>`).join("")

    box.querySelectorAll(".it").forEach((el,k)=>el.classList.toggle("on",k===sel)); box.querySelector(".it.on")?.scrollIntoView({block:"nearest"}); });

function drawScatter(cv,rows){

}

  $("#wadd").onsubmit=e=>{e.preventDefault(); const add=$("#wq").value.toUpperCase().split(/[\s,;]+/).filter(Boolean); for(const t of add) if(!list.includes(t)) list.push(t); s.lists[s.active]=list; save(s);};
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{s.lists[s.active]=list.filter(t=>t!==b.dataset.rm);save(s);});
  document.querySelectorAll("#wtbl th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(!k) return; viewWatchlist.sort={k,d:sk.k===k?-sk.d:1}; viewWatchlist();});
  $("#wexp").onclick=()=>{const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,1)],{type:"application/json"})); a.download="market-radar-watchlists.json"; a.click();};
  $("#wimp").onchange=async e=>{ try{ const x=JSON.parse(await e.target.files[0].text()); if(x.lists){ save({active:x.active||Object.keys(x.lists)[0],lists:{...s.lists,...x.lists}}); } }catch(err){ alert("Not a valid watchlist file."); } };
}

/* ------------------------------------------------------------------ SCANNER */
const SC={tab:"breakouts",sort:null,dir:-1,q:"",data:null};
async function viewScanner(){
  const m=$("#main"); const dates=await J("data/dates.json"); if(!SC.data) SC.data=await J("data/latest.json"); const d=SC.data;
  const TABS=[["breakouts","Trend + Breakout"],["breakdowns","Downtrend + Breakdown"],["rs_days","Up while SPY down"],["rs_leaders","RS Leaders"],["trend","EMA Trend"]];
  const b=d.benchmark, br=d.breadth;
  m.innerHTML=`<div class="row" style="margin-bottom:12px;justify-content:space-between">
     <div class="row"><h2>Scanner</h2><select id="sdate">${dates.map(x=>`<option value="${x}" ${x===d.date?"selected":""}>${fd(x)}</option>`).join("")}</select></div>
     <div class="row muted">${b.ticker} <b style="color:var(--text)">${b.close}</b> <span class="${cls(b.chg)}">${pct(b.chg)}</span> · ${d.universe_size} scanned · ${br.pct_in_trend}% in EMA trend · ${br.pct_above_ema200}% above 200 EMA · ${br.new_trend_today} new today</div></div>
   <div class="tabs">${TABS.map(([k,l])=>`<button data-t="${k}" class="${SC.tab===k?"on":""}">${l}<span class="n">${(d[k]||[]).length}</span></button>`).join("")}</div>
   <div class="row" style="margin-bottom:10px"><input id="sq" placeholder="Search ticker or name" value="${esc(SC.q)}" style="width:220px"><span class="note"><span class="gold">★</span> = RS line at 50-day high · click a ticker for its chart · “+ Watch” adds it to your watchlist</span></div>
   <div class="card" style="padding:4px 8px"><div class="tbl-wrap" id="stbl"></div></div>`;
  $("#sdate").onchange=async e=>{SC.data=await J(`data/scans/${e.target.value}.json`); viewScanner();};
  document.querySelectorAll(".tabs button").forEach(x=>x.onclick=()=>{SC.tab=x.dataset.t;SC.sort=null;viewScanner();});
  $("#sq").oninput=e=>{SC.q=e.target.value;drawScan();}; await stocks(); drawScan();
}
function drawScan(){
  const d=SC.data; if(SC.tab==="rs_days"&&d.benchmark.chg>=0){ $("#stbl").innerHTML=`<div class="empty">${d.benchmark.ticker} was not down on ${fd(d.date)}.</div>`; return; }
  const q=SC.q.toUpperCase(); let rows=(d[SC.tab]||[]).filter(r=>!q||r.ticker.includes(q)||(r.name||"").toUpperCase().includes(q)); if(SC.sort) rows=sortRows(rows,SC.sort,SC.dir);
  const cols=[["ticker","Ticker"],["name","Name"],["close","Close"],["chg","Chg %"],["rs","RS"],["vol_ratio","Vol ×"],["days_trend","Days in trend"],["ext_ema20","% from EMA20"],["perf_1m","1M %"]];
  $("#stbl").innerHTML=rows.length?`<table><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${SC.sort===k?(SC.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>
    <td><span class="tk" data-tk="${esc(r.ticker)}">${esc(r.ticker)}</span>${r.rs_high?' <span class="gold" title="RS line at 50-day high">★</span>':""} ${starHTML(r.ticker)}</td>
    <td class="nm">${esc(r.name)}</td><td>${r.close}</td><td class="${cls(r.chg)}">${pct(r.chg)}</td><td>${r.rs??"–"}</td><td>${r.vol_ratio??"–"}</td>
    <td>${r.days_trend}</td><td>${r.ext_ema20==null?"–":r.ext_ema20+"%"}</td><td class="${cls(r.perf_1m)}">${pct(r.perf_1m,1)}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">No stocks match.</div>';
  document.querySelectorAll("#stbl th").forEach(th=>th.onclick=()=>{const k=th.dataset.k; SC.dir=SC.sort===k?-SC.dir:1; SC.sort=k; drawScan();});
}

/* ------------------------------------------------------------------ ROTATION */
async function viewRotation(){
  const d=await J("data/latest.json"); const all=[...d.sectors,...d.industries]; const inn=all.filter(r=>r.quadrant==="Improving");
  const tbl=(rows,title)=>`<div class="card"><h3>${title}</h3><div class="tbl-wrap"><table><thead><tr><th>#</th><th>ETF</th><th>Name</th><th class="r">vs SPY 1W</th><th class="r">1M</th><th class="r">3M</th><th>Quadrant</th><th>Rank move</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank}</td>
     <td><span class="tk" data-tk="${r.ticker}">${r.ticker}</span></td><td class="nm">${esc(r.name)}</td>
     <td class="r ${cls(r.rel_1w)}">${pct(r.rel_1w,1)}</td><td class="r ${cls(r.rel_1m)}">${pct(r.rel_1m,1)}</td><td class="r ${cls(r.rel_3m)}">${pct(r.rel_3m,1)}</td>
     <td class="${r.quadrant}"><b>${r.quadrant}</b></td><td class="${cls(r.rank_change)}">${r.rank_change>0?"▲"+r.rank_change:r.rank_change<0?"▼"+(-r.rank_change):"–"}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#main").innerHTML=`<div class="row" style="margin-bottom:12px"><h2>Sector Rotation</h2><span class="muted">as of ${fd(d.date)}</span></div>
    <p>Rotating in (Improving): ${inn.length?inn.map(r=>`<b>${r.ticker}</b> ${esc(r.name)}`).join(", "):"none"}.</p>
    <div class="grid2"><div>${tbl(d.sectors,"Sectors")}${tbl(d.industries,"Industry groups")}</div>
    <div class="card"><h3>Rotation map — sectors <small>last ~5 weeks</small></h3>${rrg(d.sectors)}<p class="note">Money tends to rotate clockwise: Improving → Leading → Weakening → Lagging. Sectors moving from Improving into Leading are where strength is building.</p></div></div>`;
}
function rrg(rows){
  const W=520,H=460,P=36, pts=rows.flatMap(r=>[...r.tail,{x:r.rs_ratio,y:r.rs_mom}]).filter(p=>p.x!=null&&p.y!=null);
  const sp=k=>Math.max(1.5,...pts.map(p=>Math.abs(p[k]-100)))*1.15, sx=sp("x"), sy=sp("y");
  const X=v=>P+(v-(100-sx))/(2*sx)*(W-2*P), Y=v=>H-P-(v-(100-sy))/(2*sy)*(H-2*P), col={Leading:"#26a69a",Improving:"#4c9ffe",Weakening:"#f5a623",Lagging:"#ef5350"};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%"><rect x="${X(100)}" y="${P}" width="${W-P-X(100)}" height="${Y(100)-P}" fill="#26a69a12"/><rect x="${P}" y="${P}" width="${X(100)-P}" height="${Y(100)-P}" fill="#4c9ffe12"/>
    <rect x="${P}" y="${Y(100)}" width="${X(100)-P}" height="${H-P-Y(100)}" fill="#ef535012"/><rect x="${X(100)}" y="${Y(100)}" width="${W-P-X(100)}" height="${H-P-Y(100)}" fill="#f5a62312"/>
    <line x1="${X(100)}" x2="${X(100)}" y1="${P}" y2="${H-P}" stroke="#3a4654"/><line y1="${Y(100)}" y2="${Y(100)}" x1="${P}" x2="${W-P}" stroke="#3a4654"/>
    <g font-size="11" fill="#8794a3"><text x="${W-P-4}" y="${P+14}" text-anchor="end">LEADING</text><text x="${P+4}" y="${P+14}">IMPROVING</text><text x="${P+4}" y="${H-P-6}">LAGGING</text><text x="${W-P-4}" y="${H-P-6}" text-anchor="end">WEAKENING</text>
    <text x="${W/2}" y="${H-8}" text-anchor="middle">RS-Ratio (strength vs SPY) →</text><text x="12" y="${H/2}" transform="rotate(-90 12 ${H/2})" text-anchor="middle">RS-Momentum →</text></g>`;
  for(const r of rows){ const c=col[r.quadrant], t=[...r.tail,{x:r.rs_ratio,y:r.rs_mom}].filter(p=>p.x!=null);
    s+=`<polyline fill="none" stroke="${c}" stroke-opacity=".45" stroke-width="1.5" points="${t.map(p=>X(p.x)+","+Y(p.y)).join(" ")}"/>`;
    s+=`<circle cx="${X(r.rs_ratio)}" cy="${Y(r.rs_mom)}" r="5" fill="${c}"><title>${r.ticker} ${esc(r.name)}: ${r.quadrant}</title></circle><text x="${X(r.rs_ratio)+7}" y="${Y(r.rs_mom)+4}" font-size="11" fill="#e7ebf0">${r.ticker}</text>`; }
  return s+"</svg>";
}

/* ------------------------------------------------------------------ DOWNLOAD */
function saveCSV(name,rows){ const csv=rows.map(r=>r.map(v=>{ if(v==null) return ""; const t=String(v); return /[",\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t; }).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
async function marketDay(d){
  const url=REPO?`https://raw.githubusercontent.com/${REPO}/main/data/daily/${d.slice(0,4)}/${d}.csv.gz`:`daily/${d.slice(0,4)}/${d}.csv.gz`;
  const r=await fetch(url); if(!r.ok) throw new Error(`file for ${fd(d)} not found (${r.status})`);
  const buf=new Uint8Array(await r.arrayBuffer()); let txt;
  if(buf[0]===0x1f&&buf[1]===0x8b) txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); else txt=new TextDecoder().decode(buf);
  return txt.trim().split(/\r?\n/).map(l=>l.split(",")); }
async function viewDownload(){
  const [cal,st,dates]=await Promise.all([J("data/calendar.json"),stocks(),J("data/dates.json").catch(()=>[])]);
  const days=[...cal].reverse();
  $("#main").innerHTML=`<div class="row" style="margin-bottom:14px"><h2>Download data</h2><span class="muted">CSV files open in Excel, Google Sheets or Python. Dates are dd-MMM-yy.</span></div>
  <div class="dl-grid">
    <div class="card"><h3>Whole US market — one day</h3>
      <p class="note">Every US stock and ETF that traded that day (about 11,000 rows): date, ticker, name, open, high, low, close, volume, VWAP, number of trades. Prices are as traded that day (not adjusted for later splits). Read from the daily files saved in your repository.</p>
      <div class="row"><select id="dday">${days.map(d=>`<option value="${d}">${fd(d)}</option>`).join("")}</select><button class="pri" id="dmk">Download CSV</button><span class="muted" id="dmks"></span></div></div>
    <div class="card"><h3>One ticker — full history</h3>
      <p class="note">Daily candles for every stored day (${fd(cal[0])} → ${fd(cal.at(-1))}), adjusted for splits — the same data the charts use. Available for the ${st.list.length.toLocaleString()} charted tickers.</p>
      <div class="row"><input id="dtk" placeholder="Ticker or company" style="width:220px" autocomplete="off" value="${esc(CH.ticker||"")}">
        <label class="muted"><input type="checkbox" id="dind" checked> include EMAs, MACD, DMI and trend</label><button class="pri" id="dtkb">Download CSV</button><span class="muted" id="dtks"></span></div></div>
    <div class="card"><h3>Strategy trade log</h3>
      <p class="note">Every backtest trade: ticker, side, signal / entry / exit dates and prices, days held, P&amp;L, max run-up, max drawdown, status.</p>
      <div class="row"><button class="pri" id="dbt">Download CSV</button><span class="muted" id="dbts"></span></div></div>
    <div class="card"><h3>Scanner results — one day</h3>
      <p class="note">All scanner lists for the chosen day (breakouts, up while SPY down, RS leaders, EMA trend) in one file, with a "list" column.</p>
      <div class="row"><select id="dsc">${dates.map(d=>`<option value="${d}">${fd(d)}</option>`).join("")}</select><button class="pri" id="dscb">Download CSV</button></div></div>
  </div>`;
  const busy=(id,t)=>$(id).textContent=t;
  $("#dmk").onclick=async()=>{ const d=$("#dday").value; busy("#dmks","Preparing…");
    try{ const rows=await marketDay(d); const h=rows[0]; const out=[["date","ticker","name",...h.slice(1)]];
      for(const r of rows.slice(1)) out.push([fd(d),r[0],(st.map[r[0]]||{}).name||"",...r.slice(1)]);
      saveCSV(`US-market_${fd(d)}.csv`,out); busy("#dmks",`${(out.length-1).toLocaleString()} tickers saved`); }catch(e){ busy("#dmks","Could not download: "+e.message); } };
  attachAC($("#dtk"),t=>{ $("#dtk").value=t; });
  $("#dtkb").onclick=async()=>{ const q=$("#dtk").value.trim().toUpperCase(); const t=st.map[q]?q:(searchStocks(q,1)[0]||{}).ticker; if(!t){ busy("#dtks","No data for that ticker"); return; }
    busy("#dtks","Preparing…"); const b=await J(`data/bars/${encodeURIComponent(t)}.json`); const ds=cal.slice(b.i0), ind=$("#dind").checked;
    const head=["date","ticker","open","high","low","close","volume"]; let ex=null;
    if(ind){ const tr=trendStates(b.c), e12=emaArr(b.c,12), e26=emaArr(b.c,26), macd=b.c.map((_,i)=>e12[i]!=null&&e26[i]!=null?e12[i]-e26[i]:null), sg=emaArr(macd,9), dm=dmi(b.h,b.l,b.c,14);
      ex={tr,macd,sg,dm}; head.push(...EP.map(p=>"ema"+p),"macd","macd_signal","macd_hist","plus_di","minus_di","adx","ema_trend"); }
    const r4=v=>v==null?null:Math.round(v*1e4)/1e4; const out=[head];
    ds.forEach((d,i)=>{ if(b.c[i]==null) return; const row=[fd(d),t,b.o[i],b.h[i],b.l[i],b.c[i],b.v[i]];
      if(ex) row.push(...EP.map(p=>r4(ex.tr.e[p][i])),r4(ex.macd[i]),r4(ex.sg[i]),r4(ex.macd[i]!=null&&ex.sg[i]!=null?ex.macd[i]-ex.sg[i]:null),r4(ex.dm.plus[i]),r4(ex.dm.minus[i]),r4(ex.dm.adx[i]),ex.tr.st[i]>0?"up":ex.tr.st[i]<0?"down":"");
      out.push(row); });
    saveCSV(`${t}_daily_${fd(ds[0])}_to_${fd(ds.at(-1))}.csv`,out); busy("#dtks",`${(out.length-1).toLocaleString()} days saved`); };
  $("#dbt").onclick=async()=>{ busy("#dbts","Preparing…"); const b=await backtest();
    const out=[["ticker","name","side","signal_date","entry_date","entry_price","exit_date","exit_price","days","pnl_pct","max_runup_pct","max_drawdown_pct","status","rs_score"]];
    for(const r of b.rows) out.push([r.ticker,(st.map[r.ticker]||{}).name||"",r.side,fd(r.signal),fd(r.entry_date),r.entry,r.status==="closed"?fd(r.exit_date):"",r.status==="closed"?r.exit:"",r.bars,r.pnl,r.mfe,r.mae,r.status,r.score]);
    saveCSV(`strategy-trades_${fd(b.data_end)}.csv`,out); busy("#dbts",`${(out.length-1).toLocaleString()} trades saved`); };
  $("#dscb").onclick=async()=>{ const d=$("#dsc").value; const x=await J(`data/scans/${d}.json`); const out=[["date","list","ticker","name","close","chg_pct","rs_rating","rs_line_50d_high","vol_ratio","days_in_trend","pct_from_ema20","perf_1m_pct"]];
    for(const [k,l] of [["breakouts","Trend + breakout"],["breakdowns","Downtrend + breakdown"],["rs_days","Up while SPY down"],["rs_leaders","RS leaders"],["trend","EMA trend"]]) for(const r of (x[k]||[])) out.push([fd(d),l,r.ticker,r.name,r.close,r.chg,r.rs,r.rs_high?"yes":"",r.vol_ratio,r.days_trend,r.ext_ema20,r.perf_1m]);
    saveCSV(`scanner_${fd(d)}.csv`,out); };
}

/* ------------------------------------------------------------------ router */
async function route(){
  const [r,arg,arg2]=(location.hash.slice(1)||"portfolio").split("/");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  if(CH.chart&&r!=="chart"){ CH.chart.destroy(); CH.chart=null; }
  if(PF.eq&&r!=="portfolio"){ PF.eq.destroy(); PF.eq=null; }
  try{
    if(r==="scanner") await viewScanner(); else if(r==="chart") await viewChart(arg&&decodeURIComponent(arg),arg2);
    else if(r==="watchlist") await viewWatchlist(); else if(r==="download") await viewDownload(); else if(r==="rotation") await viewRotation(); else await viewPortfolio();
  }catch(e){ console.error(e); $("#main").innerHTML=`<div class="empty">Could not load this page (${esc(e.message)}).</div>`; }
}
window.addEventListener("hashchange",route);
attachAC($("#gq"),t=>{ $("#gq").value=""; $("#gq").blur(); location.hash="#chart/"+encodeURIComponent(t); });
$("#gq").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=$("#gq").value.trim(); if(v){ const hit=searchStocks(v,1)[0]; location.hash="#chart/"+encodeURIComponent(hit?hit.ticker:v.toUpperCase()); $("#gq").value=""; $("#gq").blur(); } } });
document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $("#gq").focus(); } });
J("data/stocks.json").then(s=>$("#asof").textContent="Data to "+fd(s.date)).catch(()=>{});
route();
</script>
